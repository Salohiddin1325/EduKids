<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3B82F6"/>
      <stop offset="50%" stop-color="#2563EB"/>
      <stop offset="100%" stop-color="#1D4ED8"/>
    </linearGradient>
    <linearGradient id="starGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FEF08A"/>
      <stop offset="30%" stop-color="#FCD34D"/>
      <stop offset="100%" stop-color="#F59E0B"/>
    </linearGradient>
    <filter id="softShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#1E3A8A" flood-opacity="0.35"/>
    </filter>
    <filter id="starGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#D97706" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Background Squircle -->
  <rect x="16" y="16" width="480" height="480" rx="112" fill="url(#bgGrad)" filter="url(#softShadow)"/>

  <!-- Subtle Inner Glow Border -->
  <rect x="18" y="18" width="476" height="476" rx="110" fill="none" stroke="#93C5FD" stroke-width="4" stroke-opacity="0.5"/>

  <!-- Playful Bubbles -->
  <!-- Amber Bubble (Math/Warmth) -->
  <circle cx="390" cy="120" r="42" fill="#F59E0B" opacity="0.9"/>
  <ellipse cx="378" cy="108" rx="12" ry="8" fill="#FFFFFF" opacity="0.6"/>

  <!-- Coral Pink Bubble (English/Playful) -->
  <circle cx="110" cy="380" r="36" fill="#FF5E7E" opacity="0.9"/>
  <ellipse cx="100" cy="370" rx="10" ry="6" fill="#FFFFFF" opacity="0.6"/>

  <!-- Mint Green Bubble (Physics/Nature) -->
  <circle cx="115" cy="135" r="28" fill="#10B981" opacity="0.9"/>
  <ellipse cx="107" cy="127" rx="8" ry="5" fill="#FFFFFF" opacity="0.6"/>

  <!-- Golden 3D Star Center -->
  <g filter="url(#starGlow)">
    <!-- 3D Bevel Base -->
    <polygon points="256,92 298,198 412,204 324,276 352,388 256,326 160,388 188,276 100,204 214,198" fill="#D97706" transform="translate(0, 10)"/>
    <!-- Main Star -->
    <polygon points="256,92 298,198 412,204 324,276 352,388 256,326 160,388 188,276 100,204 214,198" fill="url(#starGrad)"/>
  </g>

  <!-- Cute Star Eyes -->
  <ellipse cx="228" cy="245" rx="12" ry="16" fill="#1E293B"/>
  <ellipse cx="224" cy="239" rx="4" ry="6" fill="#FFFFFF"/>
  <ellipse cx="284" cy="245" rx="12" ry="16" fill="#1E293B"/>
  <ellipse cx="280" cy="239" rx="4" ry="6" fill="#FFFFFF"/>

  <!-- Rosy Cheeks -->
  <circle cx="204" cy="260" r="10" fill="#FF5E7E" opacity="0.6"/>
  <circle cx="308" cy="260" r="10" fill="#FF5E7E" opacity="0.6"/>

  <!-- Happy Smile -->
  <path d="M 238 262 Q 256 278 274 262" fill="none" stroke="#1E293B" stroke-width="6" stroke-linecap="round"/>

  <!-- Graduation Mini Cap -->
  <g transform="translate(305, 95) rotate(15)">
    <polygon points="0,-16 26,0 0,16 -26,0" fill="#4F46E5"/>
    <path d="M 0,0 L 22,20" stroke="#F59E0B" stroke-width="4" stroke-linecap="round"/>
    <circle cx="22" cy="22" r="5" fill="#F59E0B"/>
  </g>

  <!-- Brand Pill Ribbon -->
  <g transform="translate(136, 400)">
    <rect width="240" height="54" rx="27" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="3" filter="url(#softShadow)"/>
    <text x="120" y="37" font-family="'Fredoka', 'Quicksand', sans-serif" font-size="28" font-weight="700" fill="#2563EB" text-anchor="middle">EduKids</text>
  </g>
</svg>
